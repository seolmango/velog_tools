<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>velog tools</title>
  <meta name="description" content="벨로그 글 쓸 때 아쉬운 부분 채워주는 도구 모음">
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="./">velog<span>.</span>tools</a>
      <button class="icon-btn theme-toggle" type="button" aria-label="테마 전환" title="테마 전환">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>velog tools</h1>
      <p class="subtitle">벨로그 글 쓸 때 아쉬운 부분 채워주는 도구 모음임. 전부 브라우저 안에서만 돌아가고 이미지는 어디에도 안 올라감.</p>

      <div class="tool-list">
        <a class="tool-card" href="tools/caption/">
          <h2>이미지 캡션</h2>
          <p>이미지 아래에 캡션 넣고 가운데 정렬 · 크기 조절까지 해서 복사함</p>
        </a>
        <a class="tool-card" href="tools/merge/">
          <h2>이미지 나란히</h2>
          <p>여러 이미지를 옆으로 나란히 붙여서 한 장으로 만듦</p>
        </a>
        <a class="tool-card" href="tools/thumbnail/">
          <h2>썸네일 만들기</h2>
          <p>벨로그 카드 비율에 맞춘 제목 썸네일 만듦</p>
        </a>
        <a class="tool-card" href="tools/table/">
          <h2>표 변환</h2>
          <p>엑셀 · 구글 시트 · CSV를 마크다운 표로 바꿈</p>
        </a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="https://github.com/seolmango/velog_tools">GitHub</a>
    </div>
  </footer>
</body>
</html>
