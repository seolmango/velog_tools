<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지 나란히 · velog tools</title>
  <meta name="description" content="여러 이미지를 나란히 붙여 한 장으로 만듦">
  <script src="../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="merge.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="../../">velog<span>.</span>tools</a>
      <button class="icon-btn theme-toggle" type="button" aria-label="테마 전환" title="테마 전환">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>이미지 나란히</h1>
      <p class="subtitle">벨로그는 HTML 정렬 속성을 다 지워서 이미지를 옆으로 못 붙임. 여기서 한 장으로 합쳐서 붙여넣으면 됨.</p>

      <div class="stack">
        <label id="dropzone" class="dropzone" tabindex="0">
          <input id="file-input" type="file" accept="image/*" multiple hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
          <strong id="dropzone-title"><kbd>Ctrl</kbd> + <kbd>V</kbd> 로 이미지 하나씩 추가</strong>
          <span id="dropzone-sub">여러 장 드래그 앤 드롭 · 클릭해서 여러 장 선택도 됨</span>
        </label>

        <div id="editor" class="stack" hidden>
          <ol id="list" class="merge-list"></ol>

          <div class="panel">
            <div class="options">
              <div class="option">
                <span class="field-label">한 줄에</span>
                <div class="segmented" id="cols"></div>
              </div>
              <div class="option option-grow">
                <label class="field-label" for="gap">간격 <span id="gap-value" class="muted"></span></label>
                <input id="gap" type="range" min="0" max="6" step="0.5">
              </div>
              <div class="option option-grow">
                <label class="field-label" for="size">캡션 글자 크기 <span id="size-value" class="muted"></span></label>
                <input id="size" type="range" min="50" max="200" step="10">
              </div>
            </div>
          </div>

          <div class="velog-preview" id="preview">
            <div class="velog-preview-bar">
              <span>벨로그 본문에서 보이는 크기</span>
              <div class="segmented" data-option="mode">
                <button type="button" data-value="light">라이트</button>
                <button type="button" data-value="dark">다크</button>
              </div>
            </div>
            <div class="page"><canvas id="canvas"></canvas></div>
          </div>
          <p id="meta" class="meta"></p>

          <div class="actions">
            <button id="copy-btn" class="btn primary" type="button">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              이미지 복사
            </button>
            <button id="download-btn" class="btn" type="button">다운로드</button>
            <button id="reset-btn" class="btn" type="button">전부 지우기</button>
            <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 로도 복사 가능</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../../assets/common.js"></script>
  <script src="merge.js"></script>
</body>
</html>
