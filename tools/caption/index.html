<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지 캡션 · velog tools</title>
  <meta name="description" content="이미지 아래에 캡션을 넣어 클립보드로 복사합니다.">
  <script src="../../assets/theme.js"></script>
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="caption.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="../../">velog<span>.</span>tools</a>
      <button class="icon-btn theme-toggle" type="button" aria-label="테마 전환" title="테마 전환">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>이미지 캡션</h1>
      <p class="subtitle">이미지를 붙여넣고 캡션을 입력한 뒤 복사해서 벨로그에 그대로 붙여넣으세요.</p>

      <!-- 이미지가 없을 때 -->
      <label id="dropzone" class="dropzone" tabindex="0">
        <input id="file-input" type="file" accept="image/*" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <strong><kbd>Ctrl</kbd> + <kbd>V</kbd> 로 이미지 붙여넣기</strong>
        <span>또는 드래그 앤 드롭 · 클릭해서 파일 선택</span>
      </label>

      <!-- 이미지가 있을 때 -->
      <div id="editor" class="editor" hidden>
        <div class="panel">
          <label class="field-label" for="caption">캡션</label>
          <textarea id="caption" rows="2" placeholder="캡션을 입력하세요"></textarea>

          <div class="options">
            <div class="option">
              <span class="field-label">정렬</span>
              <div class="segmented" data-option="align">
                <button type="button" data-value="left">왼쪽</button>
                <button type="button" data-value="center">가운데</button>
                <button type="button" data-value="right">오른쪽</button>
              </div>
            </div>
            <div class="option">
              <span class="field-label">배경</span>
              <div class="segmented" data-option="bg">
                <button type="button" data-value="light">흰색</button>
                <button type="button" data-value="dark">어두운색</button>
                <button type="button" data-value="transparent">투명</button>
              </div>
            </div>
            <div class="option option-grow">
              <label class="field-label" for="size">글자 크기 <span id="size-value" class="muted"></span></label>
              <input id="size" type="range" min="50" max="200" step="10">
            </div>
          </div>
        </div>

        <div class="preview-wrap">
          <div id="preview" class="preview">
            <canvas id="canvas"></canvas>
          </div>
          <p id="meta" class="meta"></p>
        </div>

        <div class="actions">
          <button id="copy-btn" class="btn primary" type="button">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            이미지 복사
          </button>
          <button id="download-btn" class="btn" type="button">다운로드</button>
          <button id="reset-btn" class="btn" type="button">다른 이미지</button>
          <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 로도 복사할 수 있어요</span>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="caption.js"></script>
</body>
</html>
